# Example script for fake_people_detector: invented people, in the frame of the FAST-LIO odometry. Where they walk
# there is nobody for the lidar: with the filter on, these cylinders are cut out of the static clouds all the same.
frame: camera_init
start_time: 0.0                 # stamp [s] at which the script starts
people:
  - name: crossing              # back and forth 4 m ahead of where FAST-LIO started, 1 m/s, a stop at each end
    size: [0.5, 0.5, 1.7]       # box: length, width, height [m]
    floor_z: -0.47              # the Airy is 0.47 m above the floor when the robot stands
    loop: true
    waypoints:                  # [t, x, y]
      - [0.0, 4.0, 2.0]
      - [4.0, 4.0, -2.0]
      - [6.0, 4.0, -2.0]
      - [10.0, 4.0, 2.0]
      - [12.0, 4.0, 2.0]
  - name: standing              # still, 3 m to the left
    size: [0.5, 0.5, 1.7]
    floor_z: -0.47
    loop: false
    waypoints:
      - [0.0, 1.0, 3.0]
      - [1.0, 1.0, 3.0]
