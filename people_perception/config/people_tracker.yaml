# people_tracker: the people the detector sees, followed from scan to scan, and the confirmed ones handed to
# OptiPessiController as obstacles. Starting values, to be tuned on recorded data.
/**:
    ros__parameters:
        detections_topic: /perception/detector/objects   # frame sensor_level
        tracks_topic: /perception/tracks                 # confirmed, tentative and coasting: what the filter removes
        markers_topic: /perception/tracks_markers
        odom_frame: camera_init          # the tracks live here: it drifts but never jumps (not the SC-PGO frame)
        tf_timeout: 0.05                 # [s] wait for the TF odom_frame <- frame of the detections at their stamp
        qos_depth: 20

        gate_distance: 1.0               # [m] farthest a detection can be from where a track is expected
        max_plausible_speed: 5.0         # [m/s] a detection that far from the last one of a track is someone else.
                                         # The actors of the Gazebo warehouse leave the ends of their lanes at 4.5 m/s:
                                         # with 4.0 they started a new track at every turn
        min_score_new_track: 0.25        # low on purpose: the filter has to take the points out early
        min_score_confirm: 0.40          # mean score a track needs to be confirmed
        min_hits: 3                      # detections ...
        hits_window: 5                   # ... in this many scans, to be confirmed
        max_age: 1.0                     # [s] without a detection before a track is dropped
        shape_smoothing: 0.2             # weight of a new detection in the height and size of the box

        # Kalman filter (position and velocity on the plane, constant velocity)
        process_noise_acceleration: 1.5  # [m/s^2] how hard a person changes velocity
        measurement_noise_position: 0.1  # [m] of a detection
        initial_speed_std: 2.0           # [m/s] of a new track, whose velocity is not known

        backward_jump_reset: 2.0         # [s] a stamp this much before the last one is a restarted bag: all tracks go

        # The confirmed tracks as the obstacles of OptiPessiController (legged_controllers/ObstacleArray, HUMAN). Its
        # radius and maximum speed are those of task.info; it keeps the closest obstacles for its slots
        obstacles:
            enabled: true                # people_perception_launch.xml opti_pessi_obstacles sets it. false when another
                                         # node publishes the topic (yolo26_rgbd_detect): each would erase the other
            topic: /opti_pessi/obstacles
            frame: odom                  # the only frame the controller takes; reached with the latest TF
            max_range: 10.0              # [m] from the sensor. Each obstacle takes a slot and the solve time grows with
                                         # them; farther than radius + (max_speed + robot speed) * horizon (about 7 m)
                                         # one cannot matter
