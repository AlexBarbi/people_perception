# fake_people_detector: stands in for autoware_lidar_centerpoint (block B4 of docs/perception_pipeline.md) until
# there is a model. It answers every detector cloud with the people of a script file (launch argument people_script),
# not with what the lidar sees: see scripts/fake_people_detector.py.
/**:
    ros__parameters:
        input_cloud_topic: /perception/detector/pointcloud   # frame sensor_level
        objects_topic: /perception/detector/objects
        qos_depth: 20
        tf_timeout: 0.15                 # [s] wait for the TF sensor_level <- script frame at the stamp of the cloud,
                                         # then answer "nobody". Under the max_wait of dynamic_points_filter
        max_range: 20.48                 # [m] from the sensor: the range of the model
        detection_probability: 1.0       # of each person in each scan
        position_noise: 0.0              # [m] standard deviation, on x and y
        score: 0.8                       # existence_probability of every detection
        delay: 0.0                       # [s] between a cloud and its answer, as the inference time
        seed: 0
